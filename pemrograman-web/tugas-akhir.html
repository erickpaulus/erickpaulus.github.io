<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projek Akhir Pemrograman Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* Gaya umum */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #4CAF50;
            margin-bottom: 20px;
            font-weight: bold;
        }
        p {
            line-height: 1.6;
            color: #555;
        }
        .btn-outline-primary {
            display: inline-block;
            margin-top: 20px;
        }
        .btn-outline-primary:hover {
            background-color: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        /* Tabel styling */
        .table-container {
            margin-top: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        td {
            background-color: #f9f9f9;
            color: #333;
        }
        tr:nth-child(even) td {
            background-color: #e9e9e9;
        }
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }
            td:before {
                content: attr(data-label);
                font-weight: bold;
                text-transform: capitalize;
                color: #555;
            }
            th {
                display: none;
            }
            tr {
                border-bottom: 1px solid #ddd;
                margin-bottom: 10px;
            }
        }
        /* Gaya tambahan */
        .course-overview, .topics {
            margin-bottom: 40px;
        }
        .visitor-badge {
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>Daftar Projek Akhir Pemrograman Web</h2>
    <p>Berikut adalah daftar proyek akhir yang telah diselesaikan oleh mahasiswa:</p>

    <div class="table-container">
        <table >
            <thead>
                <tr>
                    <th>Nama Projek</th>
                    <th>Link Repo</th>
                </tr>
            </thead>
            <tbody id="project-list">
                <!-- Data akan dimuat di sini -->
            </tbody>
        </table>
    </div>

    <!-- Back Button -->
    <div class="text-center mt-4">
        <a href="https://erickpaulus.github.io/pemrograman-web/" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left"></i> Kembali ke Deskripsi
        </a>
    </div>
</div>

<script>
    // Data CSV dalam bentuk array
    const csvData = [
        ["Website Perpustakaan", "https://github.com/bun349/Perpustakaan.git", 0],
        ["Expense Tracker", "https://github.com/Wilson0024/Expense-Tracker-Web_Kelompok-2.git", 0],
        ["IKEH (IKEA)", "https://github.com/praktikum-tiunpad-2023/project-pemrograman-web-b-himatif-fmipa-unpad.git", 0],
        ["Website Manajemen Rumah Sakit UNPAD", "https://github.com/Bilirohman/project-pemweb-b-rumah-sakit-unpad", 0],
        ["Tebak Gambar Asique😍💥", "https://github.com/AlissaIndraputri230064/Proyek-Tebak-Gambar", 0],
        ["Website Sewa kosan", "https://github.com/Hafizh220705/Jatinewkost", 0],
        ["Website brand baju", "https://github.com/HitMagicc/Kaosin.git", 0],
        ["Gravion", "https://github.com/Fzzrr/GravionAviation.git", 0],
        ["website review rokok", "https://github.com/mchljordn/cigaRates", 0],
        ["K-ConcertKit", "https://github.com/praktikum-tiunpad-2023/project-pemrograman-web-b-pribumi.git", 0],
        ["Website Rental Mobil/Motor", "https://github.com/MarchellinC/Project-Pemrograman-Web-Kelompok-11.git", 0],
        ["ice cream shop", "https://github.com/praktikum-tiunpad-2023/project-pemrograman-web-b-sar", 0],
        ["website bimbel seperti ruangguru", "https://github.com/NoelianYT/educachieve", 0],
        ["Rodaza Coffee", "https://github.com/KangDap/rodaza-coffee", 1]
    ];

    // Menampilkan data ke dalam tabel
    const projectList = document.getElementById("project-list");
    csvData.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row[0]} ${row[2] === 1 ? '<i class="fas fa-star text-warning"></i>' : ''}</td>
            <td><a href="${row[1]}" target="_blank">${row[1]}</a></td>
        `;
        projectList.appendChild(tr);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
