<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Tugas Pemrograman Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #4CAF50;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .table-container {
            margin-top: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        td {
            background-color: #f9f9f9;
            color: #333;
        }
        tr:nth-child(even) td {
            background-color: #e9e9e9;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>Daftar Hasil Tugas Pemrograman Web</h2>
    <p>Berikut adalah daftar proyek akhir yang telah diselesaikan oleh siswa:</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Link Repo</th>
                </tr>
            </thead>
            <tbody id="project-list">
                <!-- Data akan dimuat di sini -->
            </tbody>
        </table>
    </div>

    <!-- Back Button -->
    <div class="text-center mt-4">
        <a href="https://erickpaulus.github.io/pemrograman-web/" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left"></i> Kembali ke Deskripsi
        </a>
    </div>
</div>

<script>
    // Data array CSV
    const csvData = [
        "https://noelianyt.github.io",
        "https://craten54.github.io/",
        "https://kurtz17.github.io/",
        "https://mchljordn.github.io/",
        "https://rivan-22.github.io/",
        "https://rantizi.github.io",
        "https://faizmuzaky1.github.io/",
        "https://deontmba.github.io/",
        "https://AlissaIndraputri230064.github.io/",
        "https://alhongz.github.io/",
        "https://bun349.github.io/",
        "https://kangdap.github.io/",
        "https://azuhadenough.github.io",
        "https://abdazizhamud.github.io/",
        "https://malyoo.github.io/PemrogramanWeb/",
        "https://robaz04.github.io/",
        "https://odechaerani.github.io/",
        "https://wilson0024.github.io/",
        "https://theophilus0054.github.io",
        "https://fzzrr.github.io/",
        "https://marchellinc.github.io/",
        "https://chientafleury.github.io/",
        "https://bilirohman.github.io/",
        "https://ooguroryuya.github.io/",
        "https://maritzaratnaa.github.io/",
        "https://dinosaurusbaik.github.io/",
        "https://hanna0036.github.io/",
        "https://skywalks567.github.io/",
        "https://audreyshna.github.io/",
        "https://nadahsym.github.io/",
        "https://hitmagicc.github.io/PemWeb/",
        "https://nikitaptrii.github.io/",
        "https://jannatul22001.github.io",
        "https://retasakun.github.io/",
        "https://varrspace.github.io./PemrogramanWeb/",
        "https://Hafizh220705.github.io",
        "https://hdans.github.io/",
        "https://yuraimi.github.io",
        "https://kaindradjoemena.github.io/",
        "https://theodora22002.github.io/"
    ];

    // Menampilkan data ke dalam tabel
    const projectList = document.getElementById("project-list");
    csvData.forEach((link, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${index + 1}</td>
            <td><a href="${link}" target="_blank">${link}</a></td>
        `;
        projectList.appendChild(tr);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
